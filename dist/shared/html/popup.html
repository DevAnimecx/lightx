<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="copyright" content="© 2026 Blackvault Inc. All Rights Reserved.">
  <title>LightX Invisible - © Blackvault Inc.</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: #000000;
      color: #ffffff;
      padding: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
    }

    .brand span {
      color: #30d158;
    }

    .version {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 500;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: rgba(28, 28, 30, 0.6);
      border: 1px solid rgba(120, 120, 128, 0.16);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #30d158;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
    }

    .current-tab {
      background: rgba(28, 28, 30, 0.6);
      border: 1px solid rgba(120, 120, 128, 0.16);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .current-favicon {
      width: 32px;
      height: 32px;
      background: rgba(120, 120, 128, 0.16);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.6);
    }

    .current-favicon svg {
      width: 16px;
      height: 16px;
    }

    .current-info {
      flex: 1;
      min-width: 0;
    }

    .current-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .current-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mode-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px;
      background: rgba(28, 28, 30, 0.6);
      border: 1px solid rgba(120, 120, 128, 0.16);
      border-radius: 10px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn:hover {
      background: rgba(120, 120, 128, 0.2);
    }

    .mode-btn.active {
      background: rgba(48, 209, 88, 0.15);
      border-color: #30d158;
      color: #30d158;
    }

    .tabs-section {
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: rgba(28, 28, 30, 0.4);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-item:hover {
      background: rgba(28, 28, 30, 0.8);
    }

    .tab-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .tab-dot.eco { background: #64d2ff; }
    .tab-dot.rest { background: #ff9f0a; }
    .tab-dot.deep { background: #ff375f; }

    .tab-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.5);
    }

    .tab-icon svg {
      width: 16px;
      height: 16px;
    }

    .tab-details {
      flex: 1;
      min-width: 0;
    }

    .tab-name {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .tab-state-text {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.4);
    }

    .footer-actions {
      display: flex;
      gap: 8px;
    }

    .footer-btn {
      flex: 1;
      padding: 10px;
      background: rgba(28, 28, 30, 0.6);
      border: 1px solid rgba(120, 120, 128, 0.16);
      border-radius: 10px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .footer-btn:hover {
      background: rgba(120, 120, 128, 0.2);
      color: #ffffff;
    }

    .footer-btn svg {
      width: 14px;
      height: 14px;
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
    }

    .copyright {
      text-align: center;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(120, 120, 128, 0.16);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">LIGHT<span>X</span></div>
    <div class="version">v4.0 © Blackvault</div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="memory-saved">0</div>
      <div class="stat-label">MB Saved</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="tabs-count">0</div>
      <div class="stat-label">Optimized</div>
    </div>
  </div>

  <div class="current-tab">
    <div class="current-favicon" id="current-favicon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/>
        <path d="M2 12h20"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
    </div>
    <div class="current-info">
      <div class="current-label">Active Tab</div>
      <div class="current-title" id="current-title">Loading...</div>
    </div>
  </div>

  <div class="mode-selector">
    <button class="mode-btn" id="mode-eco" data-mode="eco">Eco</button>
    <button class="mode-btn active" id="mode-balanced" data-mode="balanced">Balanced</button>
    <button class="mode-btn" id="mode-performance" data-mode="performance">Max</button>
  </div>

  <div class="tabs-section">
    <div class="section-title">Background Tabs</div>
    <div id="tabs-list">
      <div class="empty-state">Loading tabs...</div>
    </div>
  </div>

  <div class="footer-actions">
    <button class="footer-btn" id="dashboard-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
      </svg>
      Dashboard
    </button>
    <button class="footer-btn" id="settings-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Settings
    </button>
  </div>

  <div class="copyright">© 2026 Blackvault Inc. All Rights Reserved.</div>

  <script src="../js/popup.js"></script>
</body>
</html>
